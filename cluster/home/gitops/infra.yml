apiVersion: gitops.kluctl.io/v1beta1
kind: KluctlDeployment
metadata:
  name: deploy-home
  namespace: kluctl-system
spec:
  interval: 5m
  source:
    git:
      url: https://github.com/davidvh/kluctl.git
      path: clusterinfra
  target: local
  args:
    iprange: 192.168.10.0/24
  context: Default