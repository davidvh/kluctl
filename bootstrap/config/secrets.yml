---
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare
  namespace: homelab-config
type: Opaque
data:
  domain: {{ args.cloudflaredomain | b64encode  }}
  email: {{ args.cloudflareemail | b64encode  }}
  api-token: {{ args.cloudflareapitoken | b64encode }}
---
apiVersion: v1
kind: Secret
metadata:
  name: zerossl
  namespace: homelab-config
type: Opaque
data:
  eab: {{ args.zerossleab | b64encode }}
  hmac: {{ args.zerosslhmac | b64encode }}