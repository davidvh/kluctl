---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lbconfig
  namespace: homelab-config
data:
  vars: |
    iprange: {{ args.iprange }}
    clusterip: {{ args.clusterip }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ingress
  namespace: homelab-config
data:
  vars: |
    domain: {{ args.cloudflaredomain }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ldap
  namespace: homelab-config
data:
  vars: |
    dn: {{ args.ldapdn }}