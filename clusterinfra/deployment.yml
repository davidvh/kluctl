deployments:
  - path: namespace
  - barrier: true
  - include: kluctl
  - path: metallb
  - path: cert-manager
  - barrier: true
  #- path: gitops # TODO: figure out why this gets blocked
  - path: metallb-config
    vars:
      - clusterConfigMap:
          name: lbconfig
          namespace: homelab-config
          key: vars

commonLabels:
  examples.kluctl.io/deployment-project: "clusterinfra"

conflictResolution:
  - kind: ValidatingWebhookConfiguration
    namespace: metallb-system
    fieldPath: webhooks.*.*
    action: ignore
  - kind: CustomResourceDefinition
    fieldPathRegex: ".*\\.caBundle.*"
    action: ignore