apiVersion: gitops.kluctl.io/v1beta1
kind: KluctlDeployment
metadata:
  name: clusterinfra
  namespace: kluctl-system
spec:
  interval: 5m
  source:
    git:
      url: https://github.com/davidvh/kluctl.git
      path: clusterinfra
      ref:
        branch: initial # TODO: Change this to main
  target: local
  args:
    iprange: {{ args.iprange }}
  context: Default