apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: config
  namespace: inadyn
stringData:
  inadyn.conf: |-
    # Create a unique custom API token with the following permissions:
    # -> Zone.Zone - Read, Zone.DNS - Edit.
    provider cloudflare.com {{ "{{" }}
        username = {{ cloudflare.domain }}
        password = {{ cloudflare["api-token"] }}
        hostname = {{ cloudflare.domain }}
    {{ "}}" }}