apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mail-tls
  namespace: mailserver
spec:
  dnsNames:
  - mail.{{ ingress.domain }}
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: cloudflare-issuer
  secretName: mail-tls
  usages:
  - digital signature
  - key encipherment
  - server auth
