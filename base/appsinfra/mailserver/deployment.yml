---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maddy
  namespace: mailserver
  labels:
    app: mailserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailserver
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: mailserver
    spec:
      containers:
      - name: maddy
        image: foxcpp/maddy:0.8.1
        ports:
        - containerPort: 25
          name: smtp
        - containerPort: 143
          name: imap
        - containerPort: 587
          name: submission
        - containerPort: 993
          name: imaps
        - containerPort: 465
          name: smtps
        volumeMounts:
        - name: maddydata
          mountPath: /data
        - name: config
          mountPath: /data/maddy.conf
          readOnly: true
          subPath: maddy.conf
        resources:
          limits:
            cpu: "200m"
            memory: "32Mi"
          requests:
            cpu: "50m"
            memory: "16Mi"
      volumes:
      - name: maddydata
        persistentVolumeClaim:
          claimName: maddydata
      - name: config
        secret:
          secretName: maddy-config
