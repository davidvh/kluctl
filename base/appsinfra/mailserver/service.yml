---
apiVersion: v1
kind: Service
metadata:
  name: mailserver
  namespace: mailserver
  labels:
    app: mailserver
  annotations:
    "metallb.universe.tf/allow-shared-ip": "cluster"
spec:
  type: LoadBalancer
  loadBalancerIP: {{ lbconfig.clusterip }}
  selector:
    app: mailserver
  ports:
  - name: smtp
    protocol: TCP
    port: 25
    targetPort: 25
  - name: imap
    protocol: TCP
    port: 143
    targetPort: 143
  - name: smtps
    protocol: TCP
    port: 465
    targetPort: 465
  - name: imaps
    protocol: TCP
    port: 993
    targetPort: 993
  - name: submission
    protocol: TCP
    port: 587
    targetPort: 587
