---
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: grafana-config
  namespace: monitoring
stringData:
  grafana.ini: |
    [auth.ldap]
    # Set to `true` to enable LDAP integration (default: `false`)
    enabled = true

    # Path to the LDAP specific configuration file (default: `/etc/grafana/ldap.toml`)
    config_file = /etc/grafana/ldap.toml

    # Allow sign-up should be `true` (default) to allow Grafana to create users on successful LDAP authentication.
    # If set to `false` only already existing Grafana users will be able to login.
    allow_sign_up = true
  ldap.toml: |
    [[servers]]
    # Ldap server host (specify multiple hosts space separated)
    host = "lldap.lldap"
    # Default port is 389 or 636 if use_ssl = true
    port = 389
    # Set to true if LDAP server should use an encrypted TLS connection (either with STARTTLS or LDAPS)
    use_ssl = false
    # If set to true, use LDAP with STARTTLS instead of LDAPS
    start_tls = false
    # set to true if you want to skip SSL cert validation
    ssl_skip_verify = false
    # set to the path to your root CA certificate or leave unset to use system defaults
    # root_ca_cert = "/path/to/certificate.crt"
    # Authentication against LDAP servers requiring client certificates
    # client_cert = "/path/to/client.crt"
    # client_key = "/path/to/client.key"

    # Search user bind dn
    bind_dn = "uid={{ lldap_user.username | b64decode}},ou=people,{{ ldap.dn }}"
    # Search user bind password
    # If the password contains # or ; you have to wrap it with triple quotes. Ex """#password;"""
    bind_password = "{{ lldap_user.password | b64decode }}"

    # User search filter
    search_filter = "(uid=%s)"
    # If you want to limit to only users of a specific group use this instead:
    # search_filter = "(&(uid=%s)(memberOf=cn=lldap_admin,ou=groups,{{ ldap.dn }}))"

    # An array of base dns to search through
    search_base_dns = ["{{ ldap.dn }}"]

    # Specify names of the LDAP attributes your LDAP uses
    [servers.attributes]
    member_of = "memberOf"
    email = "mail"
    name = "displayName"
    surname = "sn"
    username = "uid"

    # If you want to map your ldap groups to grafana's groups, see: https://grafana.com/docs/grafana/latest/auth/ldap/#group-mappings
    # As a quick example, here is how you would map lldap's admin group to grafana's admin
    [[servers.group_mappings]]
    group_dn = "cn=lldap_admin,ou=groups,{{ ldap.dn }}"
    org_role = "Admin"
    grafana_admin = true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://kube-prometheus-stack-prometheus.monitoring:9090
        isDefault: true
        access: proxy
        editable: true
