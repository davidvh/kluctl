apiVersion: v1
kind: Service
metadata:
  annotations:
    lldap: https://github.com/nitnelave/lldap
    k8s: https://github.com/Evantage-WS/lldap-kubernetes
  labels:
    app: lldap-service
  name: lldap-service
  namespace: lldap
spec:
  ports:
    - name: "ldap"
      port: 389
      targetPort: 3890
    - name: "web"
      port: 80
      targetPort: 17170
  selector:
    app: lldap