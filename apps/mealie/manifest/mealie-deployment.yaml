apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.version: 1.35.0 (9532ceef3)
  labels:
    io.kompose.service: mealie
  name: mealie
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: mealie
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.version: 1.35.0 (9532ceef3)
      labels:
        io.kompose.service: mealie
    spec:
      containers:
        - env:
            - name: BASE_URL
              value: "https://mealie.{{ ingress.domain }}"
            - name: ALLOW_SIGNUP
              value: "false"
            - name: DB_ENGINE
              value: sqlite
            - name: LOG_LEVEL
              value: INFO
            - name: SMTP_HOST
              value: mail.{{ ingress.domain }}
            - name: SMTP_FROM_NAME
              value: {{ lldap_user.username | b64decode }}
            - name: SMTP_FROM_EMAIL
              value: "{{ lldap_user.username | b64decode }}@mail.{{ ingress.domain }}"
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: ldap-user
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: ldap-user
            - name: LDAP_AUTH_ENABLED
              value: "true"
            - name: LDAP_SERVER_URL
              value: "ldap://lldap.lldap:389"
            - name: LDAP_TLS_INSECURE
              value: "true"
            - name: LDAP_BASE_DN
              value: "ou=people,{{ ldap.dn }}"
            - name: LDAP_USER_FILTER
              value: "(memberof=cn=home,ou=groups,{{ ldap.dn }})"
            - name: LDAP_ADMIN_FILTER
              value: "(memberof=cn=home,ou=groups,{{ ldap.dn }})"
            - name: LDAP_QUERY_BIND
              value: "cn={{ lldap_user.username | b64decode }},ou=people,{{ ldap.dn }}"
            - name: LDAP_QUERY_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: ldap-user
            - name: LDAP_ID_ATTRIBUTE
              value: "uid"
            - name: LDAP_NAME_ATTRIBUTE
              value: "displayName"
            - name: LDAP_MAIL_ATTRIBUTE
              value: "mail"
          image: ghcr.io/mealie-recipes/mealie:v2.7.1
          name: mealie
          ports:
            - containerPort: 9000
              protocol: TCP
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
            requests:
              memory: "256Mi"
              cpu: "250m"
          volumeMounts:
            - mountPath: /app/data
              name: mealie-data
      restartPolicy: Always
      volumes:
        - name: mealie-data
          persistentVolumeClaim:
            claimName: mealie-data
